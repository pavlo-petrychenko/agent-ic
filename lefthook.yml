pre-commit:
  parallel: false
  jobs:
    - name: oxfmt
      glob: '*.{ts,tsx,js,cjs,mjs,json,jsonc,scss,css,html,md,yml,yaml}'
      exclude:
        - 'docs/**'
        - '**/AGENTS.md'
        - '**/CLAUDE.md'
        - 'pnpm-lock.yaml'
        - 'deploy/helm/**/templates/**'
      run: sh tools/git-hooks/with-tools.sh pnpm exec oxfmt -c packages/oxc-config/oxfmt.json {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: '*.{ts,tsx,js,cjs,mjs}'
      run: sh tools/git-hooks/with-tools.sh pnpm exec oxlint --type-aware {staged_files}
    - name: check-comments
      glob: '*.{ts,tsx,js,cjs,mjs,scss}'
      run: sh tools/git-hooks/with-tools.sh pnpm check:comments {staged_files}
    - name: check-structure
      run: sh tools/git-hooks/with-tools.sh pnpm check:structure
