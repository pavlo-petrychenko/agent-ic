name: agent-ic

x-dev-volumes: &dev-volumes
  - .:/workspace
  - pnpm-store:/pnpm-store
  - root-node-modules:/workspace/node_modules
  - backend-node-modules:/workspace/apps/backend/node_modules
  - web-node-modules:/workspace/apps/web/node_modules
  - contracts-node-modules:/workspace/packages/contracts/node_modules
  - flow-node-modules:/workspace/packages/flow/node_modules
  - tsconfig-node-modules:/workspace/packages/tsconfig/node_modules
  - oxc-config-node-modules:/workspace/packages/oxc-config/node_modules
  - /workspace/apps/backend/.dev

x-dev: &dev
  image: agent-ic-dev
  pull_policy: never
  init: true
  working_dir: /workspace
  volumes: *dev-volumes

x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV}
  APP_VERSION: ${APP_VERSION}
  PUBLIC_URL: ${PUBLIC_URL}
  LOG_LEVEL: ${LOG_LEVEL}
  HTTP_HOST: ${HTTP_HOST}
  API_PORT: ${API_PORT}
  GATEWAY_PORT: ${GATEWAY_PORT}
  WORKER_PORT: ${WORKER_PORT}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
  PLATFORM_ADMIN_DEV_ACCESS: ${PLATFORM_ADMIN_DEV_ACCESS}
  DATABASE_URL: postgres://app:${APP_PASSWORD}@postgres:5432/${DATABASE_NAME}
  DATABASE_SYSTEM_URL: postgres://app_system:${APP_SYSTEM_PASSWORD}@postgres:5432/${DATABASE_NAME}
  DATABASE_OWNER_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${DATABASE_NAME}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
  REDIS_QUEUE_URL: redis://redis-queue:6379
  REDIS_CACHE_URL: redis://redis-cache:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  EMAIL_FROM: ${EMAIL_FROM}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SECRET_BOX_KEY: ${SECRET_BOX_KEY}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_API_KEY: ${LLM_API_KEY}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  LANGFUSE_MODE: ${LANGFUSE_MODE}
  LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE}
  LANGFUSE_HOST: ${LANGFUSE_HOST}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE}

x-backend-depends-on: &backend-depends-on
  deps:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis-queue:
    condition: service_healthy
  redis-cache:
    condition: service_healthy
  minio:
    condition: service_healthy
  mailpit:
    condition: service_healthy

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 20s

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: https://langfuse.local.agent-ic.pavlop.dev:${TRAEFIK_HTTPS_PORT:-443}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: langfuse-redis
  REDIS_PORT: '6379'
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${S3_REGION}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${S3_REGION}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DATABASE: ${DATABASE_NAME}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SYSTEM_PASSWORD: ${APP_SYSTEM_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - psql -h 127.0.0.1 -U postgres -d ${DATABASE_NAME} -tAc 'select 1' | grep -q 1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis-queue:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
    ports:
      - 127.0.0.1:${REDIS_QUEUE_PORT:-6380}:6379
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - 127.0.0.1:${REDIS_CACHE_PORT:-6381}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    entrypoint: [sh]
    command:
      - -c
      - mkdir -p "/data/$$S3_BUCKET" /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    environment:
      S3_BUCKET: ${S3_BUCKET}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - 127.0.0.1:${MINIO_API_PORT:-9000}:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.7
    environment:
      API_PORT: ${API_PORT}
      GATEWAY_PORT: ${GATEWAY_PORT}
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:${TRAEFIK_HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - 127.0.0.1:${TRAEFIK_HTTP_PORT:-80}:80
      - 127.0.0.1:${TRAEFIK_HTTPS_PORT:-443}:443
    volumes:
      - ./deploy/docker/traefik/dynamic.yaml:/etc/traefik/dynamic/dynamic.yaml:ro
      - ./.certs:/certs:ro
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 3s
      timeout: 5s
      retries: 10

  deps:
    <<: *dev
    build:
      context: ./deploy/docker
      dockerfile: dev.Dockerfile
    command: [pnpm, install, --frozen-lockfile]
    restart: 'no'

  api:
    <<: *dev
    command: [pnpm, --filter, backend, dev:api]
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: api
    depends_on: *backend-depends-on
    healthcheck:
      <<: *node-healthcheck
      test:
        [CMD, node, deploy/docker/healthcheck.mjs, 'http://localhost:${API_PORT}/api/health/live']

  gateway:
    <<: *dev
    command: [pnpm, --filter, backend, dev:gateway]
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: gateway
    depends_on: *backend-depends-on
    healthcheck:
      <<: *node-healthcheck
      test:
        [CMD, node, deploy/docker/healthcheck.mjs, 'http://localhost:${GATEWAY_PORT}/health/live']

  worker-runs:
    <<: *dev
    command:
      [
        pnpm,
        --filter,
        backend,
        dev:worker,
        '--queues=runs-reactive,runs-proactive,outbound,notify,timers',
      ]
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: worker-runs
    depends_on: *backend-depends-on
    healthcheck:
      <<: *node-healthcheck
      test:
        [CMD, node, deploy/docker/healthcheck.mjs, 'http://localhost:${WORKER_PORT}/health/live']

  worker-ingest:
    <<: *dev
    command: [pnpm, --filter, backend, dev:worker, --queues=ingest]
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: worker-ingest
    depends_on: *backend-depends-on
    healthcheck:
      <<: *node-healthcheck
      test:
        [CMD, node, deploy/docker/healthcheck.mjs, 'http://localhost:${WORKER_PORT}/health/live']

  web:
    <<: *dev
    command: [pnpm, --filter, web, dev]
    environment:
      NODE_ENV: ${NODE_ENV}
      PUBLIC_URL: ${PUBLIC_URL}
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-healthcheck
      test: [CMD, node, deploy/docker/healthcheck.mjs, 'http://localhost:5173/']

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8
    user: '0'
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./deploy/docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    user: '0'
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - ./deploy/docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      - ./deploy/docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.local.agent-ic.pavlop.dev:${TRAEFIK_HTTPS_PORT:-443}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki

  langfuse-redis:
    profiles: [langfuse]
    image: redis:8.10-alpine
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:26.9-alpine
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  langfuse-worker:
    profiles: [langfuse]
    image: langfuse/langfuse-worker:4
    environment: *langfuse-environment
    depends_on: *langfuse-depends-on

  langfuse-web:
    profiles: [langfuse]
    image: langfuse/langfuse:4
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: agent-ic
      LANGFUSE_INIT_ORG_NAME: agent-ic
      LANGFUSE_INIT_PROJECT_ID: agent-ic-local
      LANGFUSE_INIT_PROJECT_NAME: agent-ic-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    depends_on: *langfuse-depends-on

volumes:
  postgres-data:
  redis-queue-data:
  minio-data:
  mailpit-data:
  pnpm-store:
  root-node-modules:
  backend-node-modules:
  web-node-modules:
  contracts-node-modules:
  flow-node-modules:
  tsconfig-node-modules:
  oxc-config-node-modules:
  tempo-data:
  loki-data:
  grafana-data:
  clickhouse-data:
  clickhouse-logs:
  langfuse-redis-data:
