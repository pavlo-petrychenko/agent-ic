extend type Query {
  run(id: ID!): Run!
}

extend type Mutation {
  simulateSilence(input: SimulateSilenceInput!): Run!
  runSimulatorSchedule(input: RunSimulatorScheduleInput!): SimulatorScheduleRun!
}

input SimulateSilenceInput {
  conversationId: ID!
}

input RunSimulatorScheduleInput {
  conversationId: ID!
  nodeId: String!
}

enum ScheduleConditionKind {
  customer_wrote
  silent_for
  not_escalated
  channel_type
}

type ScheduleConditionCheck {
  kind: ScheduleConditionKind!
  met: Boolean!
}

type SimulatorScheduleRun {
  run: Run!
  conditions: [ScheduleConditionCheck!]!
}

type Subscription {
  runSteps(runId: ID!): RunStepEvent!
}

enum RunStatus {
  queued
  running
  succeeded
  failed
  escalated
}

enum RunTrigger {
  message
  schedule
  inactivity
}

enum RunStepStatus {
  running
  succeeded
  failed
}

type RunStepEvent {
  runId: ID!
  stepId: ID!
  nodeId: String!
  status: RunStepStatus!
}

type RunFailure {
  reason: String!
  message: String!
  nodeId: String
}

type RunTotals {
  stepsRun: Int!
  stepsInFlow: Int!
  messagesSent: Int!
}

type RunStep {
  id: ID!
  nodeId: String!
  nodeKey: String!
  branchKey: String!
  status: RunStepStatus!
  attempt: Int!
  input: JSON!
  output: JSON
  port: String
  error: RunFailure
  startedAt: String!
  finishedAt: String
  durationMs: Int
}

type Run {
  id: ID!
  conversationId: ID!
  agentId: ID!
  versionId: ID!
  trigger: RunTrigger!
  inactivityAttempt: Int
  status: RunStatus!
  error: RunFailure
  createdAt: String!
  startedAt: String
  finishedAt: String
  durationMs: Int
  totals: RunTotals!
  steps: [RunStep!]!
}

extend type Agent {
  lastSimulationRun: SimulationRunSummary
}

extend type Simulation {
  runs: [Run!]!
}

type SimulationRunSummary {
  id: ID!
  status: RunStatus!
  finishedAt: String
  draftRevision: Int
}
