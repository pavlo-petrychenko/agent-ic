extend type Query {
  myWorkspaces: [Membership!]!
  inviteLink: InviteLink
  inviteInfo(token: String!): InviteInfo!
  members(first: Int, after: String): MemberConnection!
  membersByRole: [RoleMemberCount!]!
}

extend type Mutation {
  createWorkspace(input: CreateWorkspaceInput!): Membership!
  updateInviteLinkRole(input: UpdateInviteLinkRoleInput!): InviteLink!
  resetInviteLink: InviteLink!
  acceptInvite(token: String!): Membership!
  renameWorkspace(input: RenameWorkspaceInput!): Membership!
  rememberWorkspace(workspaceId: ID!): User!
  updateTimeZone(input: UpdateTimeZoneInput!): Membership!
  transferOwnership(input: TransferOwnershipInput!): Membership!
  leaveWorkspace(workspaceId: ID!): Boolean!
  deleteWorkspace(input: DeleteWorkspaceInput!): Boolean!
}

extend type User {
  memberships: [Membership!]!
  lastWorkspaceId: ID
}

enum WorkspaceRole {
  owner
  admin
  builder
  operator
}

type Workspace {
  id: ID!
  name: String!
  timeZone: String!
  memberCount: Int!
}

type Membership {
  workspace: Workspace!
  role: WorkspaceRole!
}

input CreateWorkspaceInput {
  name: String!
  timeZone: String!
}

input UpdateInviteLinkRoleInput {
  role: WorkspaceRole!
}

type InviteLink {
  url: String!
  role: WorkspaceRole!
  expiresAt: String!
  joinedCount: Int!
}

type InviteInfo {
  workspaceName: String!
  inviterName: String!
  memberCount: Int!
  role: WorkspaceRole!
  expiresAt: String!
}

type Member {
  id: ID!
  userId: ID!
  name: String!
  email: String!
  role: WorkspaceRole!
  lastActiveAt: String
  joinedAt: String!
}

type RoleMemberCount {
  role: WorkspaceRole!
  count: Int!
}

type MemberEdge {
  cursor: String!
  node: Member!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type MemberConnection {
  edges: [MemberEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input RenameWorkspaceInput {
  name: String!
}

input UpdateTimeZoneInput {
  timeZone: String!
}

input TransferOwnershipInput {
  membershipId: ID!
  password: String!
}

input DeleteWorkspaceInput {
  name: String!
  password: String!
}
