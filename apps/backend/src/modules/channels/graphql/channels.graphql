extend type Query {
  channel(id: ID!): Channel
  channels: [Channel!]!
}

extend type Mutation {
  connectTelegram(input: ConnectTelegramInput!): Channel!
  disconnectTelegram(id: ID!): Channel!
}

enum ChannelStatus {
  pending
  connected
  broken
  disconnected
}

enum ChannelKind {
  telegram
  api
}

type Channel {
  id: ID!
  kind: ChannelKind!
  status: ChannelStatus!
  agentId: ID
  displayName: String!
  firstName: String
  showTyping: Boolean!
  createdAt: String!
  updatedAt: String!
}

input ConnectTelegramInput {
  token: String!
  agentId: ID!
  showTyping: Boolean
}
