extend type Query {
  channel(id: ID!): Channel
  channels: [Channel!]!
}

extend type Mutation {
  connectTelegram(input: ConnectTelegramInput!): Channel!
  createApiChannel(input: CreateApiChannelInput!): ApiChannelSecret!
  deleteChannel(id: ID!): Boolean!
  disconnectTelegram(id: ID!): Channel!
  reconnectTelegram(id: ID!): Channel!
  refreshTelegramIdentity(id: ID!): Channel!
  replaceTelegramToken(input: ReplaceTelegramTokenInput!): Channel!
  rotateApiChannelKey(id: ID!): ApiChannelSecret!
  updateChannel(input: UpdateChannelInput!): Channel!
}

enum ApiReplyMode {
  response
  webhook
}

type ApiChannelSecret {
  channel: Channel!
  secret: String!
}

enum ChannelStatus {
  pending
  connected
  broken
  disconnected
}

enum ChannelKind {
  telegram
  api
}

type Channel {
  id: ID!
  kind: ChannelKind!
  status: ChannelStatus!
  agentId: ID
  displayName: String!
  firstName: String
  tokenMasked: String
  updatedByName: String
  showTyping: Boolean!
  replyMode: ApiReplyMode
  webhook: String
  endpoint: String
  createdAt: String!
  updatedAt: String!
}

input ConnectTelegramInput {
  token: String!
  agentId: ID!
  showTyping: Boolean
}

input CreateApiChannelInput {
  name: String!
  agentId: ID!
  replyMode: ApiReplyMode!
  webhook: String
}

input UpdateChannelInput {
  id: ID!
  agentId: ID!
  showTyping: Boolean!
  replyMode: ApiReplyMode
  webhook: String
}

input ReplaceTelegramTokenInput {
  id: ID!
  token: String!
}
