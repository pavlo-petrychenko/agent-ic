extend type Query {
  notificationSettings: NotificationSettings!
  unreadNotificationCount: Int!
}

extend type Mutation {
  updateNotificationChannel(input: UpdateNotificationChannelInput!): NotificationSettings!
  updateNotificationEmail(input: UpdateNotificationEmailInput!): NotificationSettings!
  markNotificationsRead(input: MarkNotificationsReadInput!): Int!
}

enum NotificationChannel {
  platform
  email
  telegram
}

type NotificationSettings {
  platform: PlatformNotificationChannelSetting!
  email: EmailNotificationChannelSetting!
  telegram: TelegramNotificationChannelSetting!
}

type PlatformNotificationChannelSetting {
  enabled: Boolean!
}

type EmailNotificationChannelSetting {
  enabled: Boolean!
  email: String
  verifiedAt: String
}

type TelegramNotificationChannelSetting {
  enabled: Boolean!
  linked: Boolean!
  linkedAt: String
}

input UpdateNotificationChannelInput {
  channel: NotificationChannel!
  enabled: Boolean!
}

input UpdateNotificationEmailInput {
  email: String!
}

input MarkNotificationsReadInput {
  conversationId: ID!
}
