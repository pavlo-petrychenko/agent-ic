extend type Query {
  notificationSettings: NotificationSettings!
  notifications(first: Int, after: String, unreadOnly: Boolean): NotificationConnection!
  unreadNotificationCount: Int!
  latestUnreadNotification: NotificationAlert
}

extend type Mutation {
  updateNotificationChannel(input: UpdateNotificationChannelInput!): NotificationSettings!
  updateNotificationEmail(input: UpdateNotificationEmailInput!): NotificationSettings!
  resendNotificationEmailVerification: NotificationSettings!
  verifyNotificationEmail(input: VerifyNotificationEmailInput!): NotificationSettings!
  createTelegramNotificationLink: TelegramNotificationLink!
  unlinkTelegramNotification: NotificationSettings!
  markNotificationRead(input: MarkNotificationReadInput!): Int!
  markAllNotificationsRead: Int!
  markNotificationsRead(input: MarkNotificationsReadInput!): Int!
}

enum NotificationChannel {
  platform
  email
  telegram
}

type NotificationSettings {
  platform: PlatformNotificationChannelSetting!
  email: EmailNotificationChannelSetting!
  telegram: TelegramNotificationChannelSetting!
}

type PlatformNotificationChannelSetting {
  enabled: Boolean!
}

type EmailNotificationChannelSetting {
  enabled: Boolean!
  email: String
  verifiedAt: String
}

type TelegramNotificationChannelSetting {
  enabled: Boolean!
  linked: Boolean!
  username: String
  botUsername: String
  linkedAt: String
}

type TelegramNotificationLink {
  code: String!
  botUsername: String!
  expiresAt: String!
}

input UpdateNotificationChannelInput {
  channel: NotificationChannel!
  enabled: Boolean!
}

input UpdateNotificationEmailInput {
  email: String!
}

input VerifyNotificationEmailInput {
  token: String!
}

input MarkNotificationReadInput {
  notificationId: ID!
}

input MarkNotificationsReadInput {
  conversationId: ID!
}

enum NotificationKind {
  escalation
  reminder
}

type Notification {
  id: ID!
  conversationId: ID!
  kind: NotificationKind!
  waitingMinutes: Int!
  customerName: String
  channelKind: String
  reason: String
  createdAt: String!
  read: Boolean!
  readAt: String
}

type NotificationEdge {
  cursor: String!
  node: Notification!
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
}

type NotificationAlert {
  id: ID!
  conversationId: ID!
  kind: NotificationKind!
  waitingMinutes: Int!
  customerName: String
  channelKind: String
  reason: String
  createdAt: String!
}
