extend type Query {
  knowledgeBases: [KnowledgeBase!]!
  knowledgeSources(knowledgeBaseId: ID!): [KnowledgeSource!]!
  knowledgeConnections: [GoogleConnection!]!
}

extend type Mutation {
  createKnowledgeBase(input: CreateKnowledgeBaseInput!): KnowledgeBase!
  renameKnowledgeBase(input: RenameKnowledgeBaseInput!): KnowledgeBase!
  deleteKnowledgeBase(input: DeleteKnowledgeBaseInput!): DeleteKnowledgeBasePayload!
  createUpload(input: CreateUploadInput!): CreateUploadPayload!
  confirmUpload(input: ConfirmUploadInput!): KnowledgeSource!
  renameSource(input: RenameSourceInput!): KnowledgeSource!
  deleteSource(input: DeleteSourceInput!): DeleteSourcePayload!
  retrySource(input: RetrySourceInput!): RetrySourcePayload!
  startGoogleConnection: StartGoogleConnectionPayload!
  completeGoogleConnection(input: CompleteGoogleConnectionInput!): GoogleConnection!
  disconnectGoogleConnection(
    input: DisconnectGoogleConnectionInput!
  ): DisconnectGoogleConnectionPayload!
}

type StartGoogleConnectionPayload {
  authorizationUrl: String!
  expiresAt: String!
}

input CompleteGoogleConnectionInput {
  state: String!
  code: String!
}

input DisconnectGoogleConnectionInput {
  id: ID!
}

type DisconnectGoogleConnectionPayload {
  id: ID!
}

enum KnowledgeConnectionProvider {
  google_docs
}

enum KnowledgeConnectionStatus {
  active
  revoked
  error
}

type GoogleConnection {
  id: ID!
  provider: KnowledgeConnectionProvider!
  accountEmail: String!
  status: KnowledgeConnectionStatus!
  scopes: [String!]!
  lastErrorCode: String
  lastErrorMessage: String
  lastUsedAt: String
  createdAt: String!
  updatedAt: String!
}

input RenameKnowledgeBaseInput {
  id: ID!
  name: String!
}

input DeleteKnowledgeBaseInput {
  id: ID!
}

type DeleteKnowledgeBasePayload {
  id: ID!
}

input CreateKnowledgeBaseInput {
  name: String!
  description: String
}

input DeleteSourceInput {
  id: ID!
}

type DeleteSourcePayload {
  id: ID!
}

input RetrySourceInput {
  id: ID!
}

input RenameSourceInput {
  id: ID!
  title: String!
}

type RetrySourcePayload {
  id: ID!
}

input CreateUploadInput {
  knowledgeBaseId: ID!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  sourceId: ID
}

type CreateUploadPayload {
  documentId: ID!
  uploadUrl: String!
}

input ConfirmUploadInput {
  documentId: ID!
}

enum KnowledgeSourceKind {
  upload
  google_docs
}

enum KnowledgeSourceStatus {
  pending
  indexing
  ready
  error
}

enum KnowledgeSyncInterval {
  hourly
  daily
  weekly
}

type KnowledgeSource {
  id: ID!
  knowledgeBaseId: ID!
  kind: KnowledgeSourceKind!
  title: String!
  status: KnowledgeSourceStatus!
  syncInterval: KnowledgeSyncInterval
  nextSyncAt: String
  lastSyncAt: String
  lastErrorCode: String
  lastErrorMessage: String
  documentCount: Int!
  chunkCount: Int!
  createdAt: String!
  updatedAt: String!
}

type KnowledgeBase {
  id: ID!
  name: String!
  description: String
  toolName: String!
  toolDescription: String
  documentCount: Int!
  chunkCount: Int!
  createdAt: String!
  updatedAt: String!
}
