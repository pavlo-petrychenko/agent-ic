extend type Query {
  knowledgeBases: [KnowledgeBase!]!
  knowledgeSources(knowledgeBaseId: ID!): [KnowledgeSource!]!
  knowledgeSource(id: ID!): KnowledgeSourceDetail!
  knowledgeConnections: [GoogleConnection!]!
}

extend type Mutation {
  createKnowledgeBase(input: CreateKnowledgeBaseInput!): KnowledgeBase!
  renameKnowledgeBase(input: RenameKnowledgeBaseInput!): KnowledgeBase!
  deleteKnowledgeBase(input: DeleteKnowledgeBaseInput!): DeleteKnowledgeBasePayload!
  createUpload(input: CreateUploadInput!): CreateUploadPayload!
  confirmUpload(input: ConfirmUploadInput!): KnowledgeSource!
  renameSource(input: RenameSourceInput!): KnowledgeSource!
  updateDocumentSummary(input: UpdateDocumentSummaryInput!): KnowledgeSourceDocument!
  removeSourceDocument(input: RemoveSourceDocumentInput!): RemoveSourceDocumentPayload!
  deleteSource(input: DeleteSourceInput!): DeleteSourcePayload!
  retrySource(input: RetrySourceInput!): RetrySourcePayload!
  syncSource(input: SyncSourceInput!): SyncSourcePayload!
  startGoogleConnection: StartGoogleConnectionPayload!
  completeGoogleConnection(input: CompleteGoogleConnectionInput!): GoogleConnection!
  disconnectGoogleConnection(
    input: DisconnectGoogleConnectionInput!
  ): DisconnectGoogleConnectionPayload!
  createGooglePickerSession(connectionId: ID!): GooglePickerSession!
  createGoogleDocsSource(input: CreateGoogleDocsSourceInput!): CreateGoogleDocsSourcePayload!
}

type GooglePickerSession {
  accessToken: String!
  apiKey: String!
  appId: String!
  expiresAt: String!
}

input GooglePickedDocumentInput {
  id: String!
  name: String!
  mimeType: String!
  url: String
  resourceKey: String
}

input CreateGoogleDocsSourceInput {
  knowledgeBaseId: ID!
  connectionId: ID!
  documents: [GooglePickedDocumentInput!]!
}

enum GooglePickerSkipReason {
  unavailable
  unsupported
  trashed
  alreadyAdded
}

type GooglePickerSkippedDocument {
  id: String!
  name: String!
  reason: GooglePickerSkipReason!
}

type CreateGoogleDocsSourcePayload {
  source: KnowledgeSource!
  skipped: [GooglePickerSkippedDocument!]!
}

type StartGoogleConnectionPayload {
  authorizationUrl: String!
  expiresAt: String!
}

input CompleteGoogleConnectionInput {
  state: String!
  code: String!
}

input DisconnectGoogleConnectionInput {
  id: ID!
}

type DisconnectGoogleConnectionPayload {
  id: ID!
}

enum KnowledgeConnectionProvider {
  google_docs
}

enum KnowledgeConnectionStatus {
  active
  revoked
  error
}

type GoogleConnection {
  id: ID!
  provider: KnowledgeConnectionProvider!
  accountEmail: String!
  status: KnowledgeConnectionStatus!
  scopes: [String!]!
  lastErrorCode: String
  lastErrorMessage: String
  lastUsedAt: String
  createdAt: String!
  updatedAt: String!
}

input RenameKnowledgeBaseInput {
  id: ID!
  name: String!
}

input DeleteKnowledgeBaseInput {
  id: ID!
}

type DeleteKnowledgeBasePayload {
  id: ID!
}

input CreateKnowledgeBaseInput {
  name: String!
  description: String
}

input DeleteSourceInput {
  id: ID!
}

type DeleteSourcePayload {
  id: ID!
}

input RetrySourceInput {
  id: ID!
}

input SyncSourceInput {
  id: ID!
}

input RenameSourceInput {
  id: ID!
  title: String!
}

input UpdateDocumentSummaryInput {
  id: ID!
  summary: String!
}

input RemoveSourceDocumentInput {
  sourceId: ID!
  documentId: ID!
}

type RemoveSourceDocumentPayload {
  sourceId: ID!
  documentId: ID!
}

type RetrySourcePayload {
  id: ID!
}

type SyncSourcePayload {
  id: ID!
}

input CreateUploadInput {
  knowledgeBaseId: ID!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  sourceId: ID
}

type CreateUploadPayload {
  documentId: ID!
  uploadUrl: String!
}

input ConfirmUploadInput {
  documentId: ID!
}

enum KnowledgeSourceKind {
  upload
  google_docs
}

enum KnowledgeSourceStatus {
  pending
  indexing
  ready
  error
}

enum KnowledgeDocumentStatus {
  pending
  indexing
  indexed
  error
  removed
}

enum KnowledgeDocumentStaleReason {
  missing
  trashed
  gone
}

enum KnowledgeSyncInterval {
  hourly
  daily
  weekly
}

type KnowledgeSource {
  id: ID!
  knowledgeBaseId: ID!
  connectionId: ID
  kind: KnowledgeSourceKind!
  title: String!
  status: KnowledgeSourceStatus!
  syncInterval: KnowledgeSyncInterval
  nextSyncAt: String
  lastSyncAt: String
  lastErrorCode: String
  lastErrorMessage: String
  staleDocumentCount: Int!
  documentCount: Int!
  chunkCount: Int!
  createdAt: String!
  updatedAt: String!
}

type KnowledgeSourceDetail {
  source: KnowledgeSource!
  connection: GoogleConnection
  documents: [KnowledgeSourceDocument!]!
}

type KnowledgeSourceDocument {
  id: ID!
  title: String!
  status: KnowledgeDocumentStatus!
  stale: Boolean!
  staleReason: KnowledgeDocumentStaleReason
  summary: String
  errorCode: String
  errorMessage: String
  tokenCount: Int!
  chunkCount: Int!
  createdAt: String!
  updatedAt: String!
}

type KnowledgeBase {
  id: ID!
  name: String!
  description: String
  toolName: String!
  toolDescription: String
  documentCount: Int!
  chunkCount: Int!
  createdAt: String!
  updatedAt: String!
}
