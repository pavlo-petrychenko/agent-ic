extend type Query {
  inboxConversations(input: InboxConversationsInput!): [InboxConversationSummary!]!
  inboxConversation(input: InboxConversationInput!): InboxConversationDetail!
  inboxNeedsYouCount: Int!
}

extend type Subscription {
  inboxActivity: InboxActivityEvent!
}

enum InboxActivityKind {
  conversation_changed
}

type InboxActivityEvent {
  conversationId: ID!
  kind: InboxActivityKind!
}

input InboxConversationsInput {
  limit: Int
}

input InboxConversationInput {
  id: ID!
}

type InboxConversationSummary {
  id: ID!
  state: ConversationState!
  handledByMe: Boolean!
  handledByName: String
  hasBeenHandled: Boolean!
  channelKind: ChannelConversationKind!
  channelId: ID
  channelName: String
  agentId: ID!
  agentName: String!
  agentVersion: Int!
  endUserName: String
  endUserExternalId: String!
  preview: String!
  createdAt: String!
  lastMessageAt: String!
  lastEscalatedAt: String
  closedAt: String
}

type InboxConversationDetail {
  summary: InboxConversationSummary!
  messages: [Message!]!
}
