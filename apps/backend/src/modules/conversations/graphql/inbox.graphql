extend type Query {
  inboxConversations(input: InboxConversationsInput!): [InboxConversationSummary!]!
  inboxConversation(input: InboxConversationInput!): InboxConversationDetail!
  inboxNeedsYouCount: Int!
  inboxCounts(input: InboxCountsInput): InboxCounts!
  inboxFilterOptions: InboxFilterOptions!
}

enum InboxQueue {
  needs_you
  live
  closed
}

type InboxCounts {
  needsYou: Int!
  live: Int!
  closed: Int!
}

extend type Subscription {
  inboxActivity: InboxActivityEvent!
}

enum InboxActivityKind {
  conversation_changed
}

type InboxActivityEvent {
  conversationId: ID!
  kind: InboxActivityKind!
}

input InboxConversationsInput {
  limit: Int
  after: InboxConversationsCursor
  queue: InboxQueue!
  channelIds: [ID!]
  agentIds: [ID!]
  search: String
}

input InboxCountsInput {
  channelIds: [ID!]
  agentIds: [ID!]
  search: String
}

type InboxFilterOptions {
  channels: [InboxFilterOption!]!
  agents: [InboxFilterOption!]!
}

type InboxFilterOption {
  id: ID!
  name: String!
}

input InboxConversationsCursor {
  lastMessageAt: String!
  id: ID!
}

input InboxConversationInput {
  id: ID!
}

type InboxConversationSummary {
  id: ID!
  state: ConversationState!
  handledByMe: Boolean!
  handledByName: String
  hasBeenHandled: Boolean!
  channelKind: ChannelConversationKind!
  channelId: ID
  channelName: String
  agentId: ID!
  agentName: String!
  agentVersion: Int!
  endUserName: String
  endUserExternalId: String!
  preview: String!
  createdAt: String!
  lastMessageAt: String!
  lastEscalatedAt: String
  waitingSince: String
  closedAt: String
}

type InboxConversationDetail {
  summary: InboxConversationSummary!
  messages: [Message!]!
}
