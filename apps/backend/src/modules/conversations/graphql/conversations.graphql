extend type Subscription {
  conversationActivity(conversationId: ID!): ConversationActivityEvent!
}

enum ConversationActivityKind {
  message_added
  run_started
  run_finished
}

type ConversationActivityEvent {
  conversationId: ID!
  kind: ConversationActivityKind!
  messageId: ID
  runId: ID
}

extend type Query {
  simulation(agentId: ID!): Simulation
}

extend type Mutation {
  startSimulation(input: StartSimulationInput!): Simulation!
  restartSimulation(input: RestartSimulationInput!): Simulation!
  sendSimulatorMessage(input: SendSimulatorMessageInput!): Message!
  replyAsOperator(input: ReplyAsOperatorInput!): Message!
  handBack(input: HandBackInput!): Conversation!
}

enum ConversationState {
  agent_active
  waiting
  handled
  closed
}

enum ChannelKind {
  simulated
  telegram
  api
}

enum MessageAuthor {
  customer
  agent
  operator
  system
}

input StartSimulationInput {
  agentId: ID!
  versionId: ID
  channelKind: ChannelKind!
  language: String
}

input RestartSimulationInput {
  agentId: ID!
}

input SendSimulatorMessageInput {
  conversationId: ID!
  text: String!
}

input ReplyAsOperatorInput {
  conversationId: ID!
  text: String!
}

input HandBackInput {
  conversationId: ID!
}

type Conversation {
  id: ID!
  state: ConversationState!
  channelKind: ChannelKind!
  language: String
  versionId: ID
  createdAt: String!
}

type Message {
  id: ID!
  author: MessageAuthor!
  text: String!
  quickReplies: [String!]!
  runId: ID
  createdAt: String!
}

type Simulation {
  conversation: Conversation!
  messages: [Message!]!
}
