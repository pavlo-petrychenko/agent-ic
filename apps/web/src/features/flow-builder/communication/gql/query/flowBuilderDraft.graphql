query FlowBuilderDraft($agentId: ID!) {
  agent(id: $agentId) {
    id
    name
    description
    draftBaseVersionNumber
    draftNumber
    liveVersionNumber
    hasUnpublishedChanges
    draftChangeCount
  }
  agentDraft(agentId: $agentId) {
    revision
    version {
      id
      flow
    }
  }
}
