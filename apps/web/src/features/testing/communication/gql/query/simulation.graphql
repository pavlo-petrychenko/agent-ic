query Simulation($agentId: ID!) {
  simulation(agentId: $agentId) {
    conversation {
      id
      state
    }
    messages {
      id
      author
      text
      runId
      createdAt
    }
    runs {
      id
      status
      createdAt
      error {
        message
      }
      steps {
        id
        nodeId
        output
      }
    }
  }
}
