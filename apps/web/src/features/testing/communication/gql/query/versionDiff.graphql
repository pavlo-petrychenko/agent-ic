query VersionDiff($agentId: ID!, $fromId: ID!, $toId: ID!) {
  agentVersionDiff(agentId: $agentId, fromId: $fromId, toId: $toId) {
    addedNodes
    removedNodes
    changedNodes {
      nodeId
      key
      fields {
        path
        before
        after
      }
    }
    renamedKeys {
      nodeId
      from
      to
    }
    addedEdges
    removedEdges
    changedEdges
    settingsChanges {
      path
      before
      after
    }
    changeCount
  }
}
