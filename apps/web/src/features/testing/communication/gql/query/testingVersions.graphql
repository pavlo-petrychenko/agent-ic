query TestingVersions($agentId: ID!) {
  agent(id: $agentId) {
    id
    draftChangeCount
  }
  agentVersions(agentId: $agentId) {
    id
    number
    status
    flow
  }
  agentDraft(agentId: $agentId) {
    issues {
      code
      severity
      nodeId
      edgeId
      path
      params
    }
    version {
      flow
    }
  }
}
