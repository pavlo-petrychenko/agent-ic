query InboxConversation($id: ID!) {
  inboxConversation(input: { id: $id }) {
    summary {
      id
    }
    details {
      guard {
        label
        nodeType
        reason
      }
      run {
        id
        agentVersion
        startedAt
        durationMs
        steps {
          id
          label
          nodeType
          value
        }
      }
      channelName
      replyTarget
      notified {
        names
        allOperators
        channels
      }
      handled {
        name
        since
        until
      }
      runsCount
    }
    messages {
      id
      author
      authorId
      authorName
      systemEvent
      text
      createdAt
    }
  }
}
