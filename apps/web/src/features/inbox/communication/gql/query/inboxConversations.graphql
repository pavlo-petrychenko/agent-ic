query InboxConversations($limit: Int) {
  inboxConversations(input: { limit: $limit }) {
    id
    state
    handledByMe
    handledByName
    hasBeenHandled
    channelKind
    channelId
    channelName
    agentId
    agentName
    agentVersion
    endUserName
    endUserExternalId
    preview
    createdAt
    lastMessageAt
    lastEscalatedAt
    closedAt
  }
}
