query InboxConversations(
  $limit: Int
  $after: InboxConversationsCursor
  $queue: InboxQueue!
  $channelIds: [ID!]
  $agentIds: [ID!]
  $search: String
) {
  inboxConversations(
    input: {
      limit: $limit
      after: $after
      queue: $queue
      channelIds: $channelIds
      agentIds: $agentIds
      search: $search
    }
  ) {
    id
    state
    handledByMe
    handledByName
    hasBeenHandled
    channelKind
    channelId
    channelName
    agentId
    agentName
    agentVersion
    endUserName
    endUserExternalId
    preview
    createdAt
    lastMessageAt
    lastEscalatedAt
    waitingSince
    closedAt
  }
}
