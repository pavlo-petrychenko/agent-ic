mutation ConfirmUpload($input: ConfirmUploadInput!) {
  confirmUpload(input: $input) {
    id
    knowledgeBaseId
    kind
    title
    status
    syncInterval
    syncTime
    syncWeekday
    timezone
    nextSyncAt
    lastSyncAt
    lastErrorCode
    lastErrorMessage
    staleDocumentCount
    documentCount
    chunkCount
    createdAt
    updatedAt
  }
}
