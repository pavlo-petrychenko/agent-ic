query KnowledgeSourceDetail($id: ID!) {
  knowledgeSource(id: $id) {
    source {
      id
      knowledgeBaseId
      connectionId
      kind
      title
      status
      syncInterval
      nextSyncAt
      lastSyncAt
      lastErrorCode
      lastErrorMessage
      documentCount
      chunkCount
      createdAt
      updatedAt
    }
    connection {
      id
      accountEmail
      status
    }
    documents {
      id
      title
      status
      summary
      errorCode
      errorMessage
      tokenCount
      chunkCount
      createdAt
      updatedAt
    }
  }
}
