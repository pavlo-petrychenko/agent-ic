receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  resource:
    attributes:
      - key: deployment.environment.name
        value: local
        action: insert
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_matching_keys(attributes, "^(ai\\.(prompt|response|toolCall)|gen_ai\\.(prompt|completion|input|output|system_instructions)|langfuse\\.(observation|trace)\\.(input|output)|input\\.value|output\\.value).*")
          - delete_key(attributes, "graphql.source")
          - replace_pattern(attributes["url.full"], "/bot[^/?#]+", "/bot{token}")
          - replace_pattern(attributes["url.path"], "/bot[^/?#]+", "/bot{token}")
          - replace_pattern(attributes["http.url"], "/bot[^/?#]+", "/bot{token}")
          - replace_pattern(attributes["http.target"], "/bot[^/?#]+", "/bot{token}")
          - replace_pattern(name, "/bot[^/?#]+", "/bot{token}")
  batch: {}

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [otlp_http/tempo]
