global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:__API_PORT__']
        labels: { namespace: local }
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:__GATEWAY_PORT__']
        labels: { namespace: local }
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:__WORKER_PORT__']
        labels: { namespace: local }
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
        labels: { namespace: local }
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
        labels: { namespace: local }
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { namespace: local }
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels: { namespace: local }
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: { namespace: local }
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { namespace: local }
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']
        labels: { namespace: local }
  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: { namespace: local }
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { namespace: local }
  - job_name: silo
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
        labels: { namespace: local }
