{{- $namespaces := .Values.networkPolicy }}
{{- range $name, $workload := .Values.workloads }}
{{- if eq $workload.role "api" }}
{{- $context := dict "root" $ "component" $name "workload" $workload }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-ic.componentName" $context }}
  labels:
    {{- include "agent-ic.labels" $context | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-ic.selectorLabels" $context | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespaces.traefikNamespace | quote }}
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespaces.prometheusNamespace | quote }}
      ports:
        - port: {{ $workload.port }}
          protocol: TCP
{{- end }}
{{- end }}
