{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
{{- $context := dict "root" $ "component" (printf "dashboard-%s" $name) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-ic.componentName" $context }}
  labels:
    {{- include "agent-ic.labels" $context | nindent 4 }}
    {{- toYaml $.Values.dashboards.labels | nindent 4 }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
