name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_VERSION: 2026.9.1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_SCM_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:comments
      - run: pnpm check:structure
      - run: pnpm test:tools
      - run: pnpm depcruise
      - run: pnpm exec turbo run typecheck --affected
      - run: pnpm typecheck:tools
      - run: pnpm exec turbo run build --affected
      - run: pnpm exec turbo run build --filter=web
      - run: pnpm exec turbo run storybook:build --filter=web
      - run: pnpm --filter backend db:check
      - run: pnpm exec turbo run test --affected

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_CACHE: ${{ github.workspace }}/.cache/kubeconform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: helm kubeconform actionlint yq
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.KUBECONFORM_CACHE }}
          key: kubeconform-${{ hashFiles('mise.toml') }}
      - run: mise run lint:workflows
      - run: mise run chart:validate
