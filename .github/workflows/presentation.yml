name: presentation

on:
  push:
    branches: [main]
    paths:
      - docs/presentation.html
      - docs/presentation-assets/**
      - .github/workflows/presentation.yml
  workflow_dispatch:

concurrency:
  group: presentation
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_DIR: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$SITE_DIR"
          cp docs/presentation.html "$SITE_DIR/index.html"
          cp -R docs/presentation-assets "$SITE_DIR/presentation-assets"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ env.SITE_DIR }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
