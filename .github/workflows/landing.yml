name: landing

on:
  push:
    branches: [main]
    paths:
      - apps/landing/**
      - packages/design-tokens/**
      - .github/workflows/landing.yml
  pull_request:
    paths:
      - apps/landing/**
      - packages/design-tokens/**
      - .github/workflows/landing.yml

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: agent-ic-landing
  PRODUCTION_BRANCH: main
  PREVIEW_COMMENT_TITLE: '**Landing preview**'

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not available, so the landing deploy is skipped."
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      LANDING_APP_URL: ${{ vars.LANDING_APP_URL }}
      LANDING_SITE_URL: ${{ vars.LANDING_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=landing
      - id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            name="$(printf '%s' "$HEAD_REF" | tr -c 'a-zA-Z0-9-' '-')"
          else
            name="$PRODUCTION_BRANCH"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.149.0
          packageManager: pnpm
          workingDirectory: apps/landing
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.branch.outputs.name }}
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          body="$(printf '%s\n\n- Branch preview: %s\n- This deployment: %s\n- Commit: %s\n' \
            "$PREVIEW_COMMENT_TITLE" "${ALIAS_URL:-$DEPLOYMENT_URL}" "$DEPLOYMENT_URL" "$HEAD_SHA")"
          comment_id="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${PREVIEW_COMMENT_TITLE}\")))][0].id // empty" \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
