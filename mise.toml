[tools]
node = "24"
pnpm = "12.9.1"
mkcert = "1.4.4"
kubectl = "1.37.1"
helm = "4.3.0"
kubeseal = "0.40.0"
actionlint = "1.7.12"
kubeconform = "0.8.0"
yq = "4.54.1"

[env]
_.file = ".env"

[tasks.setup]
description = "One-time setup: tools, .env and ports, certificate, hosts, then the stack"
run = [
  "mise install",
  "mkcert -install",
  "tools/dev/env.sh",
  "tools/dev/ports.sh",
  "tools/dev/certs.sh",
  "tools/dev/hosts.sh",
  "mise run setup:stack",
]
run_windows = "echo agent-ic runs on Windows inside WSL2: see the Windows section of README.md && exit 1"

[tasks."setup:stack"]
description = "Install dependencies and hooks, build the images, start the stack, migrate and seed"
hide = true
run = [
  "pnpm install --frozen-lockfile",
  "pnpm exec lefthook install",
  "docker compose build",
  "docker compose up -d --wait",
  "mise run db:migrate",
  "mise run db:seed",
  "mise run status",
  "tools/dev/urls.sh",
]

[tasks.start]
description = "Start everything or the listed services and follow the logs"
usage = 'arg "[svc]..." var=#true help="Services to start"'
run = [
  "tools/dev/env.sh",
  "docker compose up -d --wait ${usage_svc}",
  "docker compose --profile '*' logs -f --tail=50 ${usage_svc}",
]

[tasks.add]
description = "Add one service to the running stack"
usage = 'arg "<svc>" help="Service to add"'
run = "docker compose up -d --wait ${usage_svc}"

[tasks.stop]
description = "Stop everything or one service"
usage = 'arg "[svc]" help="Service to stop"'
run = "docker compose --profile '*' stop ${usage_svc}"

[tasks.restart]
description = "Restart one service"
usage = 'arg "<svc>" help="Service to restart"'
run = "docker compose --profile '*' restart ${usage_svc}"

[tasks.status]
description = "Show the state of every service"
run = "docker compose --profile '*' ps --all"

[tasks.logs]
description = "Follow the logs of everything or one service"
usage = 'arg "[svc]" help="Service to follow"'
run = "docker compose --profile '*' logs -f --tail=100 ${usage_svc}"

[tasks.shell]
description = "Open a shell in a running service"
usage = 'arg "<svc>" help="Service to enter"'
run = "docker compose --profile '*' exec ${usage_svc} sh"

[tasks."db:migrate"]
description = "Apply database migrations"
run = "docker compose run --rm --no-deps api pnpm run db:migrate"

[tasks."db:reset"]
description = "Recreate the database volume, then migrate and seed"
run = [
  "docker compose rm --stop --force postgres",
  "docker volume rm agent-ic_postgres-data",
  "docker compose up -d --wait postgres",
  "mise run db:migrate",
  "mise run db:seed",
]

[tasks."db:seed"]
description = "Load development seed data"
run = "docker compose run --rm --no-deps api pnpm run db:seed"

[tasks."db:psql"]
description = "Open psql as app_owner, app or app_system"
usage = 'arg "[role]" default="app_owner" help="Database role"'
run = "tools/dev/psql.sh ${usage_role}"

[tasks.codegen]
description = "Regenerate generated code"
run = "docker compose run --rm --no-deps api pnpm run codegen"

[tasks.check]
description = "Run every guardrail"
run = "pnpm check"

[tasks."chart:validate"]
description = "Lint, render and validate the Helm chart with kubeconform"
env = { KUBERNETES_VERSION = "1.36.0", CRD_CATALOG_REF = "4c8dc296d32b06d15ccde9668ff136c951f4d539" }
run = "tools/chart/validate.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.test]
description = "Run the tests"
run = "pnpm test"

[tasks.e2e]
description = "Run the end-to-end tests"
run = "pnpm e2e"

[tasks.clean]
description = "Remove containers, volumes and certificates"
run = ["docker compose --profile '*' down --volumes --remove-orphans", "rm -rf .certs"]
