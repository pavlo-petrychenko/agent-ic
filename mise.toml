[tools]
node = "24"
pnpm = "12.9.1"
mkcert = "1.4.4"
kubectl = "1.37.1"
helm = "4.3.0"
kubeseal = "0.40.0"
actionlint = "1.7.12"
kubeconform = "0.8.0"
yq = "4.54.1"

[env]
_.file = ".env"

[tasks.setup]
description = "One-time setup: tools, .env and ports, certificate, hosts, then the stack"
run = ["mise install", "node tools/dev.ts setup"]

[tasks.start]
description = "Start everything or the listed services and follow the logs"
run = "node tools/dev.ts start"

[tasks.add]
description = "Add one service to the running stack: mise run add <svc>"
run = "node tools/dev.ts add"

[tasks.stop]
description = "Stop everything or one service"
run = "node tools/dev.ts stop"

[tasks.restart]
description = "Restart one service: mise run restart <svc>"
run = "node tools/dev.ts restart"

[tasks.status]
description = "Show the state of every service"
run = "node tools/dev.ts status"

[tasks.logs]
description = "Follow the logs of everything or one service"
run = "node tools/dev.ts logs"

[tasks.shell]
description = "Open a shell in a running service: mise run shell <svc>"
run = "node tools/dev.ts shell"

[tasks."db:migrate"]
description = "Apply database migrations"
run = "node tools/dev.ts db:migrate"

[tasks."db:reset"]
description = "Recreate the database volume, then migrate and seed"
run = "node tools/dev.ts db:reset"

[tasks."db:seed"]
description = "Load development seed data"
run = "node tools/dev.ts db:seed"

[tasks."db:psql"]
description = "Open psql as app_owner (default), app or app_system"
run = "node tools/dev.ts db:psql"

[tasks.codegen]
description = "Regenerate generated code"
run = "node tools/dev.ts codegen"

[tasks.check]
description = "Run every guardrail"
run = "pnpm check"

[tasks."chart:validate"]
description = "Lint, render and validate the Helm chart with kubeconform"
env = { KUBERNETES_VERSION = "1.36.0", CRD_CATALOG_REF = "4c8dc296d32b06d15ccde9668ff136c951f4d539" }
run = "tools/chart/validate.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.test]
description = "Run the tests"
run = "pnpm test"

[tasks.clean]
description = "Remove containers, volumes and certificates"
run = "node tools/dev.ts clean"
