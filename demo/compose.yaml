name: agent-ic-demo

x-backend-image: &backend-image
  image: ghcr.io/pavlo-petrychenko/agent-ic-backend:${IMAGE_TAG}
  platform: linux/amd64
  init: true

x-backend-environment: &backend-environment
  NODE_ENV: production
  APP_VERSION: ${IMAGE_TAG}
  PUBLIC_URL: ${PUBLIC_URL}
  LOG_LEVEL: ${LOG_LEVEL}
  HTTP_HOST: 0.0.0.0
  API_PORT: ${API_PORT}
  GATEWAY_PORT: ${GATEWAY_PORT}
  WORKER_PORT: ${WORKER_PORT}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
  PLATFORM_ADMIN_DEV_ACCESS: 'false'
  DATABASE_URL: postgres://app:${APP_PASSWORD}@postgres:5432/${DATABASE_NAME}
  DATABASE_SYSTEM_URL: postgres://app_system:${APP_SYSTEM_PASSWORD}@postgres:5432/${DATABASE_NAME}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
  REDIS_QUEUE_URL: redis://redis:6379
  REDIS_CACHE_URL: redis://redis:6379
  EMAIL_MODE: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_REQUIRE_TLS: 'false'
  EMAIL_FROM: ${EMAIL_FROM}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET}
  SECRET_BOX_KEY: ${SECRET_BOX_KEY}
  SECRET_BOX_KEY_VERSION: '1'
  LLM_BASE_URL: http://mock-llm:4010/v1
  LLM_API_KEY: ${LLM_API_KEY}
  EMBEDDING_MODEL: jina-embeddings-v5-text-small
  USAGE_CREDITS_LIMIT: ${USAGE_CREDITS_LIMIT}
  USAGE_CONVERSATIONS_LIMIT: '100000'
  USAGE_CHUNKS_LIMIT: '100000'
  LANGFUSE_MODE: 'off'
  OTEL_SDK_DISABLED: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAMESPACE: agent-ic
  OTEL_TRACES_SAMPLER_ARG: '1'
  DEPLOYMENT_ENVIRONMENT: demo

x-backend-depends-on: &backend-depends-on
  seed:
    condition: service_completed_successfully
  mock-llm:
    condition: service_healthy
  mailpit:
    condition: service_healthy
  otel-collector:
    condition: service_started

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DATABASE: ${DATABASE_NAME}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SYSTEM_PASSWORD: ${APP_SYSTEM_PASSWORD}
      LANGFUSE_DB_PASSWORD: unused-in-the-demo
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
    mem_limit: 256m
    volumes:
      - ../deploy/docker/postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./postgres/02-grafana-reader.sh:/docker-entrypoint-initdb.d/02-grafana-reader.sh:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, '${DATABASE_NAME}']

  redis:
    image: redis:8.10-alpine
    command: [redis-server, --maxmemory-policy, noeviction, --appendonly, 'yes']
    mem_limit: 128m
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, redis-cli, ping]

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - 127.0.0.1:${MAILPIT_HOST_PORT}:8025
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: [CMD, /mailpit, readyz]

  mock-llm:
    image: node:24-alpine
    command:
      - node
      - /app/server.mjs
      - --port=4010
      - --latency=${MOCK_LATENCY_MS}
      - --failure-rate=${MOCK_FAILURE_RATE}
    mem_limit: 96m
    volumes:
      - ./mock-llm/server.mjs:/app/server.mjs:ro
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:4010/health']

  migrate:
    <<: *backend-image
    command: [migrate]
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_OWNER_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${DATABASE_NAME}
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *backend-image
    command: [seed]
    environment:
      <<: *backend-environment
      NODE_ENV: development
      OTEL_SDK_DISABLED: 'true'
      OTEL_SERVICE_NAME: seed
    mem_limit: 384m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    <<: *backend-image
    command: [serve, --role=api]
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: api
    mem_limit: 512m
    depends_on: *backend-depends-on
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:${API_PORT}/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]

  worker:
    <<: *backend-image
    command:
      [serve, --role=worker, '--queues=runs-reactive,runs-proactive,outbound,notify,timers,ingest']
    environment:
      <<: *backend-environment
      OTEL_SERVICE_NAME: worker
    mem_limit: 512m
    depends_on: *backend-depends-on
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:${WORKER_PORT}/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]

  web:
    image: ghcr.io/pavlo-petrychenko/agent-ic-web:${IMAGE_TAG}
    platform: linux/amd64
    environment:
      WEB_PORT: '8080'
      WEB_HEALTH_PATH: /healthz
      WEB_RUNTIME_CONFIG_PATH: /usr/share/nginx/html/config.json
      API_UPSTREAM: api:${API_PORT}
    ports:
      - 127.0.0.1:${WEB_HOST_PORT}:8080
    mem_limit: 64m
    volumes:
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']

  k6:
    image: grafana/k6:2.3.0
    entrypoint: [sh]
    command: [/scripts/run-steady.sh]
    environment:
      BASE_URL: http://web:8080
      ORIGIN: ${PUBLIC_URL}
      LOAD_RATE: ${LOAD_RATE}
      LOAD_RUN_DURATION: ${LOAD_RUN_DURATION}
      BURST_VUS: ${BURST_VUS}
      BURST_DURATION: ${BURST_DURATION}
      K6_NO_USAGE_REPORT: 'true'
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),avg,max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    mem_limit: 192m
    volumes:
      - ./load:/scripts:ro
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.10.8
    user: '0'
    command: [-config.file=/etc/tempo/tempo.yaml]
    environment:
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ../deploy/docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    user: '0'
    command: [-config.file=/etc/loki/loki.yaml]
    environment:
      GOMEMLIMIT: 192MiB
    mem_limit: 256m
    volumes:
      - ../deploy/docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  otel-collector:
    image: otel/opentelemetry-collector-k8s:0.161.0
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      GOMEMLIMIT: 96MiB
    mem_limit: 128m
    volumes:
      - ../deploy/docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.15.0
    user: '0'
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    environment:
      GOMEMLIMIT: 256MiB
    mem_limit: 320m
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:9090/-/ready']

  alloy:
    image: grafana/alloy:v1.20.1
    user: '0'
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    environment:
      GOMEMLIMIT: 160MiB
    mem_limit: 192m
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: redis://redis:6379
      GOMEMLIMIT: 24MiB
    mem_limit: 48m
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable
      GOMEMLIMIT: 24MiB
    mem_limit: 48m
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_HOST_PORT}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/demo/live-writes.json
      DATABASE_NAME: ${DATABASE_NAME}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
      GOMEMLIMIT: 320MiB
    ports:
      - 127.0.0.1:${GRAFANA_HOST_PORT}:3000
    mem_limit: 384m
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/demo:ro
      - ../deploy/helm/agent-ic/dashboards:/var/lib/grafana/dashboards/agent-ic:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:3000/api/health']

volumes:
  postgres-data:
  redis-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
