global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels: { namespace: demo }
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3002']
        labels: { namespace: demo }
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { namespace: demo }
  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: { namespace: demo }
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
        labels: { namespace: demo }
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
        labels: { namespace: demo }
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { namespace: demo }
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: { namespace: demo }
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels: { namespace: demo }
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { namespace: demo }
